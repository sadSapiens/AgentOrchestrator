version: '3.8'

services:
  backend:
    build: ./backend
    container_name: agent_orchestrator_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./results:/app/results
    networks:
      - orchestrator_net
    restart: always

  frontend:
    build: ./frontend
    container_name: agent_orchestrator_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - orchestrator_net
    restart: always

networks:
  orchestrator_net:
    driver: bridge
